services:
    Ibexa\Bundle\RepositoryInstaller\Event\Subscriber\BuildSchemaSubscriber:
        autoconfigure: true
        public: false
        arguments:
            - '@=service("kernel").locateResource("@IbexaCoreBundle/Resources/config/storage/legacy/schema.yaml")'

    Ibexa\Bundle\RepositoryInstaller\Migration\InstallSchemaMigration:
        autowire: true
        public: false
        arguments:
            $connection: '@ibexa.persistence.connection'
        tags:
            - { name: !php/const Ibexa\Contracts\DoctrineMigrations\Migrations\IbexaMigrationTag::TAG }

    Ibexa\Bundle\RepositoryInstaller\Migration\AddUrlAliasMlLinkIndexMigration:
        autowire: true
        public: false
        arguments:
            $connection: '@ibexa.persistence.connection'
        tags:
            - { name: !php/const Ibexa\Contracts\DoctrineMigrations\Migrations\IbexaMigrationTag::TAG }

    Ibexa\Bundle\RepositoryInstaller\Migration\ImportDataMigration:
        autowire: true
        public: false
        arguments:
            $connection: '@ibexa.persistence.connection'
        tags:
            - { name: !php/const Ibexa\Contracts\DoctrineMigrations\Migrations\IbexaMigrationTag::TAG }

    Ibexa\Bundle\RepositoryInstaller\Migration\TaggedMigrationsRunner:
        public: false
        arguments:
            # Mandatory: this whole service definition is removed by RemoveTaggedMigrationsRunnerPass
            # when unavailable, so compilation never attempts to resolve this reference in that case.
            # Not defined here, since it belongs to that package, not this one.
            # Ibexa\Contracts\DoctrineMigrations\Migrations\IbexaOnlyDependencyFactory::SERVICE_ID
            $dependencyFactory: '@ibexa.doctrine_migrations.dependency_factory.ibexa_migrations_only'

    Ibexa\Bundle\RepositoryInstaller\Migration\SchemaBuilderEventSchemaProvider:
        autowire: true
        public: false

    Ibexa\Bundle\RepositoryInstaller\Installer\DbBasedInstaller:
        abstract: true
        arguments: ['@ibexa.persistence.connection']
        lazy: true

    Ibexa\Bundle\RepositoryInstaller\Installer\CoreInstaller:
        autowire: true
        parent: Ibexa\Bundle\RepositoryInstaller\Installer\DbBasedInstaller
        arguments:
            $schemaBuilderEventEnabled: '%ibexa.installer.schema_builder_event.enabled%'
            # Optional: TaggedMigrationsRunner's own service definition may not exist at all
            # (RemoveTaggedMigrationsRunnerPass removes it when "ibexa/doctrine-migrations" isn't
            # installed/enabled) - autowiring alone can't express "pass null if absent".
            $taggedMigrationsRunner: '@?Ibexa\Bundle\RepositoryInstaller\Migration\TaggedMigrationsRunner'
        tags:
            - { name: ibexa.installer, type: ibexa-oss }

    Ibexa\Bundle\RepositoryInstaller\Command\InstallPlatformCommand:
        arguments:
            $connection: '@ibexa.persistence.connection'
            $installers: !tagged_locator { tag: 'ibexa.installer', index_by: 'type' }
            $cachePool: '@ibexa.cache_pool'
            $environment: "%kernel.environment%"
            $repositoryConfigurationProvider: '@Ibexa\Bundle\Core\ApiLoader\RepositoryConfigurationProvider'
        tags:
            - { name: console.command }

    Ibexa\Bundle\RepositoryInstaller\Command\ValidatePasswordHashesCommand:
        arguments:
            $userStorage: '@Ibexa\Core\FieldType\User\UserStorage'
            $passwordHashService: '@Ibexa\Contracts\Core\Repository\PasswordHashService'
        tags:
            - { name: console.command }
