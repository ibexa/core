services:
    Ibexa\Core\Repository\ContentService\AsyncPublicationService:
        autowire: true
        arguments:
            $persistenceHandler: '@ibexa.spi.persistence.legacy.async_publication.handler'
            $bus: '@ibexa.messenger.bus'

        lazy: true

    # Content publishing strategies. The interface is aliased to the synchronous strategy by
    # default; AsyncContentPublisherStrategyPass overrides the alias to the asynchronous strategy
    # when the "async_content_publish" flag is enabled (only one strategy is ever wired).
    Ibexa\Core\Repository\ContentService\SynchronousContentPublisher:
        arguments:
            $contentService: '@ibexa.api.service.content'

    Ibexa\Core\Repository\ContentService\AsynchronousContentPublisher:
        arguments:
            $asyncPublicationService: '@Ibexa\Core\Repository\ContentService\AsyncPublicationService'

    Ibexa\Contracts\Core\Repository\ContentPublisherInterface:
        alias: Ibexa\Core\Repository\ContentService\SynchronousContentPublisher
